name: Build Kansas TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE" || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/az \
            /opt/microsoft \
            || true

          sudo docker system prune \
            --all \
            --force \
            --volumes \
            || true

          sudo apt-get clean
          sudo rm -rf \
            /var/lib/apt/lists/* \
            /var/cache/apt/archives/* \
            || true

          echo
          echo "Disk space after cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE" || true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            python-is-python3 \
            rsync \
            libssl-dev \
            liblz4-tool \
            zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod 755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Select build filesystem
        shell: bash
        run: |
          ROOT_FREE="$(
            df -Pk "$GITHUB_WORKSPACE" |
              awk 'NR == 2 {print $4}'
          )"

          MNT_FREE=0

          if [ -d /mnt ]; then
            MNT_FREE="$(
              df -Pk /mnt |
                awk 'NR == 2 {print $4}'
            )"
          fi

          echo "Workspace free KiB: $ROOT_FREE"
          echo "/mnt free KiB:      $MNT_FREE"

          if [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
            TWRP_SRC="/mnt/twrp-src"
          else
            TWRP_SRC="$GITHUB_WORKSPACE/twrp-src"
          fi

          sudo rm -rf "$TWRP_SRC"
          sudo mkdir -p "$TWRP_SRC"
          sudo chown -R "$USER:$USER" "$TWRP_SRC"

          echo "TWRP_SRC=$TWRP_SRC" >> "$GITHUB_ENV"
          echo "Selected build directory: $TWRP_SRC"

          df -h "$TWRP_SRC"

      - name: Initialize and synchronize TWRP
        shell: bash
        run: |
          cd "$TWRP_SRC"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j1

          echo
          echo "Storage after source synchronization:"
          df -h "$TWRP_SRC"

          du -sh \
            "$TWRP_SRC" \
            "$TWRP_SRC/.repo" \
            2>/dev/null || true

      - name: Install Kansas device tree
        shell: bash
        run: |
          mkdir -p \
            "$TWRP_SRC/device/motorola/kansas"

          rsync -a \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='twrp-src/' \
            "$GITHUB_WORKSPACE/" \
            "$TWRP_SRC/device/motorola/kansas/"

          test -s \
            "$TWRP_SRC/device/motorola/kansas/BoardConfig.mk"

          test -s \
            "$TWRP_SRC/device/motorola/kansas/AndroidProducts.mk"

      - name: Build vendor_boot
        shell: bash
        run: |
          cd "$TWRP_SRC"

          echo "Storage immediately before build:"
          df -h "$TWRP_SRC"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_kansas-eng

          mka vendorbootimage -j1 2>&1 |
            tee build-kansas.log

      - name: Repack vendor_boot explicitly
        shell: bash
        run: |
          cd "$TWRP_SRC"

          OUT="out/target/product/kansas"
          IMAGE="$OUT/vendor_boot.img"
          TMP_IMAGE="$OUT/vendor_boot.repacked.img"
          PLATFORM_RAMDISK="$GITHUB_WORKSPACE/prebuilt/vendor_ramdisk_platform.lz4"
          STOCK_DTB="$GITHUB_WORKSPACE/prebuilt/dtb.img"
          LIMIT=67108864
          PLATFORM_SHA256="ac6c150c2ce9d8e82840547d5c70b8a411b160f9e6f886575fcbf5ef3df92f4f"
          DTB_SHA256="38692d745df0331434780944de62f1b4e5c5b1a0f72ece8a773efa673aad5a08"

          test -s "$IMAGE"
          test -s "$PLATFORM_RAMDISK"
          test -s "$STOCK_DTB"

          echo "$PLATFORM_SHA256  $PLATFORM_RAMDISK" |
            sha256sum --check --strict

          echo "$DTB_SHA256  $STOCK_DTB" |
            sha256sum --check --strict

          TMP_UNPACK="$OUT/vendor_boot.unpack"
          RECOVERY_RAMDISK="$TMP_UNPACK/recovery.vendor_ramdisk_fragment.lz4"

          rm -rf "$TMP_UNPACK"
          mkdir -p "$TMP_UNPACK"

          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "$IMAGE" \
            --out "$TMP_UNPACK" \
            2>&1 |
            tee "$TMP_UNPACK/unpack-report.txt"

          python3 - "$IMAGE" "$TMP_UNPACK" "$RECOVERY_RAMDISK" <<'PY'
          import hashlib
          import os
          import struct
          import sys

          image_path, unpack_dir, recovery_path = sys.argv[1:]

          RAMDISK_TYPES = {
              1: "PLATFORM",
              2: "RECOVERY",
              3: "DLKM",
          }

          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)

          def align(value, page_size):
              return ((value + page_size - 1) // page_size) * page_size

          with open(image_path, "rb") as image:
              data = image.read()

          if len(data) < 2128:
              fail("vendor_boot.img is too small for a v4 header")

          if data[:8] != b"VNDRBOOT":
              fail("vendor_boot magic is invalid")

          header_version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          vendor_ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          header_size = struct.unpack_from("<I", data, 2096)[0]
          dtb_size = struct.unpack_from("<I", data, 2100)[0]
          table_size = struct.unpack_from("<I", data, 2112)[0]
          entry_count = struct.unpack_from("<I", data, 2116)[0]
          entry_size = struct.unpack_from("<I", data, 2120)[0]

          if header_version != 4:
              fail(f"vendor_boot header version is {header_version}, expected 4")

          if page_size <= 0:
              fail(f"invalid page size {page_size}")

          if header_size < 2128:
              fail(f"invalid v4 header size {header_size}")

          if entry_size < 108:
              fail(f"vendor ramdisk table entry size is {entry_size}, expected at least 108")

          if table_size < entry_count * entry_size:
              fail("vendor ramdisk table is smaller than its declared entries")

          ramdisk_offset = align(header_size, page_size)
          dtb_offset = ramdisk_offset + align(vendor_ramdisk_size, page_size)
          table_offset = dtb_offset + align(dtb_size, page_size)

          if table_offset + table_size > len(data):
              fail("vendor ramdisk table extends past end of image")

          if ramdisk_offset + vendor_ramdisk_size > len(data):
              fail("vendor ramdisk data extends past end of image")

          unpacked_files = []
          for root, _, filenames in os.walk(unpack_dir):
              for filename in filenames:
                  path = os.path.join(root, filename)
                  if not os.path.isfile(path):
                      continue

                  with open(path, "rb") as unpacked:
                      payload = unpacked.read()

                  unpacked_files.append({
                      "path": os.path.relpath(path, unpack_dir),
                      "size": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  })

          fragments = []
          for index in range(entry_count):
              entry = table_offset + index * entry_size
              fragment_size, fragment_offset, fragment_type = struct.unpack_from("<III", data, entry)
              fragment_name = (
                  data[entry + 12:entry + 44]
                  .split(b"\0", 1)[0]
                  .decode("ascii", errors="replace")
              )

              if fragment_offset + fragment_size > vendor_ramdisk_size:
                  fail(f"fragment {index} extends past vendor ramdisk section")

              fragment = data[
                  ramdisk_offset + fragment_offset:
                  ramdisk_offset + fragment_offset + fragment_size
              ]
              fragment_sha256 = hashlib.sha256(fragment).hexdigest()
              matching_files = sorted(
                  item["path"]
                  for item in unpacked_files
                  if item["size"] == fragment_size and item["sha256"] == fragment_sha256
              )

              fragments.append({
                  "index": index,
                  "name": fragment_name,
                  "type": fragment_type,
                  "type_name": RAMDISK_TYPES.get(fragment_type, f"UNKNOWN({fragment_type})"),
                  "size": fragment_size,
                  "payload": fragment,
                  "files": matching_files,
              })

          print("Unpacked vendor ramdisk fragments:")
          for fragment in fragments:
              files = ", ".join(fragment["files"]) if fragment["files"] else "<no separate unpacked file>"
              print(
                  f"  index={fragment['index']} "
                  f"name={fragment['name']!r} "
                  f"type={fragment['type_name']}({fragment['type']}) "
                  f"size={fragment['size']} "
                  f"files={files}"
              )

          recovery_fragments = [
              fragment for fragment in fragments
              if fragment["name"] == "recovery" and fragment["type"] == 2
          ]

          if not recovery_fragments:
              fail("missing recovery vendor ramdisk fragment")

          if len(recovery_fragments) != 1:
              fail(f"found {len(recovery_fragments)} recovery vendor ramdisk fragments, expected exactly one")

          recovery_fragment = recovery_fragments[0]

          if recovery_fragment["size"] <= 4:
              fail(
                  "recovery vendor ramdisk fragment is empty or malformed: "
                  f"{recovery_fragment['size']} bytes"
              )

          with open(recovery_path, "wb") as recovery:
              recovery.write(recovery_fragment["payload"])
          PY

          RECOVERY_SIZE="$(stat -c %s "$RECOVERY_RAMDISK")"

          echo "Using extracted recovery ramdisk fragment: $RECOVERY_RAMDISK ($RECOVERY_SIZE bytes)"

          rm -f "$TMP_IMAGE"

          python3 system/tools/mkbootimg/mkbootimg.py \
            --vendor_boot "$TMP_IMAGE" \
            --header_version 4 \
            --pagesize 4096 \
            --base 0x40000000 \
            --kernel_offset 0x00000000 \
            --ramdisk_offset 0x26f00000 \
            --tags_offset 0x07c80000 \
            --dtb_offset 0x07c80000 \
            --dtb "$STOCK_DTB" \
            --vendor_cmdline "bootopt=64S3,32N2,64N2 mem.enable_mglru=1 loglevel=4 initcall_debug=0" \
            --board "" \
            --ramdisk_type PLATFORM \
            --ramdisk_name platform \
            --vendor_ramdisk_fragment "$PLATFORM_RAMDISK" \
            --ramdisk_type RECOVERY \
            --ramdisk_name recovery \
            --vendor_ramdisk_fragment "$RECOVERY_RAMDISK"

          SIZE="$(stat -c %s "$TMP_IMAGE")"

          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "ERROR: repacked vendor_boot.img is not below partition size"
            exit 1
          fi

          mv -f "$TMP_IMAGE" "$IMAGE"

      - name: Verify vendor_boot
        shell: bash
        run: |
          cd "$TWRP_SRC"

          IMAGE="out/target/product/kansas/vendor_boot.img"
          LIMIT=67108864
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"
          PLATFORM_SHA256="ac6c150c2ce9d8e82840547d5c70b8a411b160f9e6f886575fcbf5ef3df92f4f"
          DTB_SHA256="38692d745df0331434780944de62f1b4e5c5b1a0f72ece8a773efa673aad5a08"

          test -f "$IMAGE"

          SIZE="$(stat -c %s "$IMAGE")"

          echo "vendor_boot image size: $SIZE"
          echo "vendor_boot partition limit: $LIMIT"

          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "ERROR: vendor_boot.img exceeds partition size"
            exit 1
          fi

          rm -rf verify "$ARTIFACTS"
          mkdir -p verify "$ARTIFACTS"

          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "$IMAGE" \
            --out verify \
            2>&1 |
            tee "$ARTIFACTS/verify-report.txt"

          grep -q \
            'vendor boot image header version: 4' \
            "$ARTIFACTS/verify-report.txt"

          python3 - "$IMAGE" "$PLATFORM_SHA256" "$DTB_SHA256" "$LIMIT" <<'PY'
          import hashlib
          import struct
          import sys

          image_path, platform_sha256, dtb_sha256, limit = sys.argv[1:]
          limit = int(limit)

          with open(image_path, "rb") as image:
              data = image.read()

          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)

          def align(value, page_size):
              return ((value + page_size - 1) // page_size) * page_size

          if len(data) >= limit:
              fail(f"vendor_boot.img is {len(data)} bytes, not below {limit}")

          if len(data) < 2128:
              fail("vendor_boot.img is too small for a v4 header")

          if data[:8] != b"VNDRBOOT":
              fail("vendor_boot magic is invalid")

          header_version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          vendor_ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          header_size = struct.unpack_from("<I", data, 2096)[0]
          dtb_size = struct.unpack_from("<I", data, 2100)[0]
          table_size = struct.unpack_from("<I", data, 2112)[0]
          entry_count = struct.unpack_from("<I", data, 2116)[0]
          entry_size = struct.unpack_from("<I", data, 2120)[0]

          if header_version != 4:
              fail(f"vendor_boot header version is {header_version}, expected 4")

          if page_size <= 0:
              fail(f"invalid page size {page_size}")

          if header_size < 2128:
              fail(f"invalid v4 header size {header_size}")

          if entry_count != 2:
              fail(f"fragment count is {entry_count}, expected 2")

          if entry_size < 108:
              fail(f"vendor ramdisk table entry size is {entry_size}, expected at least 108")

          if table_size < entry_count * entry_size:
              fail("vendor ramdisk table is smaller than its declared entries")

          ramdisk_offset = align(header_size, page_size)
          dtb_offset = ramdisk_offset + align(vendor_ramdisk_size, page_size)
          table_offset = dtb_offset + align(dtb_size, page_size)

          if table_offset + table_size > len(data):
              fail("vendor ramdisk table extends past end of image")

          if ramdisk_offset + vendor_ramdisk_size > len(data):
              fail("vendor ramdisk data extends past end of image")

          if dtb_offset + dtb_size > len(data):
              fail("DTB extends past end of image")

          dtb = data[dtb_offset:dtb_offset + dtb_size]
          actual_dtb_sha256 = hashlib.sha256(dtb).hexdigest()

          if actual_dtb_sha256 != dtb_sha256:
              fail(f"DTB SHA-256 is {actual_dtb_sha256}, expected {dtb_sha256}")

          expected = [
              ("platform", 1, platform_sha256),
              ("recovery", 2, None),
          ]

          for index, (expected_name, expected_type, expected_sha256) in enumerate(expected):
              entry = table_offset + index * entry_size
              fragment_size, fragment_offset, fragment_type = struct.unpack_from("<III", data, entry)
              fragment_name = (
                  data[entry + 12:entry + 44]
                  .split(b"\0", 1)[0]
                  .decode("ascii", errors="replace")
              )

              if fragment_name != expected_name:
                  fail(f"fragment {index} name is {fragment_name!r}, expected {expected_name!r}")

              if fragment_type != expected_type:
                  fail(f"fragment {index} type is {fragment_type}, expected {expected_type}")

              if fragment_size <= 4:
                  fail(f"fragment {index} size is {fragment_size}, expected greater than 4")

              if fragment_offset + fragment_size > vendor_ramdisk_size:
                  fail(f"fragment {index} extends past vendor ramdisk section")

              fragment = data[
                  ramdisk_offset + fragment_offset:
                  ramdisk_offset + fragment_offset + fragment_size
              ]

              if len(fragment) != fragment_size:
                  fail(f"fragment {index} data is truncated")

              if expected_sha256:
                  actual_sha256 = hashlib.sha256(fragment).hexdigest()

                  if actual_sha256 != expected_sha256:
                      fail(
                          f"fragment {index} SHA-256 is {actual_sha256}, "
                          f"expected {expected_sha256}"
                      )

          print("vendor_boot fragment validation passed")
          PY

          cp -f \
            "$IMAGE" \
            "$ARTIFACTS/vendor_boot.img"

          cp -f \
            build-kansas.log \
            "$ARTIFACTS/build-kansas.log"

          (
            cd "$ARTIFACTS"
            sha256sum vendor_boot.img |
              tee vendor_boot.sha256
          )

          echo
          echo "Artifact contents:"
          find "$ARTIFACTS" \
            -maxdepth 1 \
            -type f \
            -printf '%10s  %f\n' |
            sort

      - name: Upload unflashed build
        uses: actions/upload-artifact@v4
        with:
          name: kansas-twrp-unflashed
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
