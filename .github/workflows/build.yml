name: Build Kansas TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE" || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/az \
            /opt/microsoft \
            || true

          sudo docker system prune \
            --all \
            --force \
            --volumes \
            || true

          sudo apt-get clean
          sudo rm -rf \
            /var/lib/apt/lists/* \
            /var/cache/apt/archives/* \
            || true

          echo
          echo "Disk space after cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE" || true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            python-is-python3 \
            rsync \
            libssl-dev \
            liblz4-tool \
            zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod 755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Select build filesystem
        shell: bash
        run: |
          ROOT_FREE="$(
            df -Pk "$GITHUB_WORKSPACE" |
              awk 'NR == 2 {print $4}'
          )"

          MNT_FREE=0

          if [ -d /mnt ]; then
            MNT_FREE="$(
              df -Pk /mnt |
                awk 'NR == 2 {print $4}'
            )"
          fi

          echo "Workspace free KiB: $ROOT_FREE"
          echo "/mnt free KiB:      $MNT_FREE"

          if [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
            TWRP_SRC="/mnt/twrp-src"
          else
            TWRP_SRC="$GITHUB_WORKSPACE/twrp-src"
          fi

          sudo rm -rf "$TWRP_SRC"
          sudo mkdir -p "$TWRP_SRC"
          sudo chown -R "$USER:$USER" "$TWRP_SRC"

          echo "TWRP_SRC=$TWRP_SRC" >> "$GITHUB_ENV"
          echo "Selected build directory: $TWRP_SRC"

          df -h "$TWRP_SRC"

      - name: Initialize and synchronize TWRP
        shell: bash
        run: |
          cd "$TWRP_SRC"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j1

          echo
          echo "Storage after source synchronization:"
          df -h "$TWRP_SRC"

          du -sh \
            "$TWRP_SRC" \
            "$TWRP_SRC/.repo" \
            2>/dev/null || true

      - name: Install Kansas device tree
        shell: bash
        run: |
          mkdir -p \
            "$TWRP_SRC/device/motorola/kansas"

          rsync -a \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='twrp-src/' \
            "$GITHUB_WORKSPACE/" \
            "$TWRP_SRC/device/motorola/kansas/"

          test -s \
            "$TWRP_SRC/device/motorola/kansas/BoardConfig.mk"

          test -s \
            "$TWRP_SRC/device/motorola/kansas/AndroidProducts.mk"

      - name: Build vendor_boot
        shell: bash
        run: |
          cd "$TWRP_SRC"

          echo "Storage immediately before build:"
          df -h "$TWRP_SRC"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_kansas-eng

          mka vendorbootimage -j1 2>&1 |
            tee build-kansas.log

      - name: Verify vendor_boot
        shell: bash
        run: |
          cd "$TWRP_SRC"

          IMAGE="out/target/product/kansas/vendor_boot.img"
          LIMIT=67108864
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"

          test -f "$IMAGE"

          SIZE="$(stat -c %s "$IMAGE")"

          echo "vendor_boot image size: $SIZE"
          echo "vendor_boot partition limit: $LIMIT"

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: vendor_boot.img exceeds partition size"
            exit 1
          fi

          rm -rf verify "$ARTIFACTS"
          mkdir -p verify "$ARTIFACTS"

          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "$IMAGE" \
            --out verify \
            2>&1 |
            tee "$ARTIFACTS/verify-report.txt"

          grep -q \
            'vendor boot image header version: 4' \
            "$ARTIFACTS/verify-report.txt"

          grep -q \
            'type: 0x1' \
            "$ARTIFACTS/verify-report.txt"

          grep -q \
            'type: 0x2' \
            "$ARTIFACTS/verify-report.txt"

          cp -f \
            "$IMAGE" \
            "$ARTIFACTS/vendor_boot.img"

          cp -f \
            build-kansas.log \
            "$ARTIFACTS/build-kansas.log"

          (
            cd "$ARTIFACTS"
            sha256sum vendor_boot.img |
              tee vendor_boot.sha256
          )

          echo
          echo "Artifact contents:"
          find "$ARTIFACTS" \
            -maxdepth 1 \
            -type f \
            -printf '%10s  %f\n' |
            sort

      - name: Upload unflashed build
        uses: actions/upload-artifact@v4
        with:
          name: kansas-twrp-unflashed
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
